    <!-- R Loop & Leg (Blue) -->
    <path d="M310 90 C390 90 470 120 470 210 C470 280 410 320 340 330 L470 410 L390 410 L280 340 L310 340 C380 340 400 290 400 210 C400 150 350 140 310 140 Z" fill="url(#rLoopGrad)"/>
  </g>
</svg>
